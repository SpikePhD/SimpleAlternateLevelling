name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  portable-tests:
    name: Portable tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset portable-tests
      - name: Build
        run: cmake --build --preset portable-tests
      - name: Test
        run: ctest --preset portable-tests

  windows-plugin:
    name: Windows plugin, tests, and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download pinned FFDec
        shell: pwsh
        run: |
          $url = "https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version25.1.3/ffdec_25.1.3.zip"
          $archive = Join-Path $env:RUNNER_TEMP "ffdec_25.1.3.zip"
          $destination = Join-Path $env:RUNNER_TEMP "ffdec_25.1.3"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = "0b39cd56d1365f161059fff2b7055ea90446782fd1c452a2ce62ab22d66a1e4e"
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFDec archive checksum mismatch." }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $jar = Get-ChildItem $destination -Filter ffdec.jar -Recurse | Select-Object -First 1 -ExpandProperty FullName
          "SAL_CI_FFDEC_JAR=$jar" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Select runner vcpkg
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: cmake --preset windows-release-tests -DSAL_JAVA_EXECUTABLE="$env:JAVA_HOME/bin/java.exe" -DSAL_FFDEC_JAR="$env:SAL_CI_FFDEC_JAR"

      - name: Build
        run: cmake --build --preset windows-release-tests

      - name: Test
        run: ctest --preset windows-release-tests

      - name: Verify skill-menu SWF
        run: cmake --build --preset windows-release-tests --target verify_skill_menu

      - name: Verify runtime metadata and imports
        shell: pwsh
        run: |
          $generated = "out/build/windows-release-tests/__SimpleAlternateLevellingPlugin.cpp"
          if (-not (Select-String -Path $generated -SimpleMatch "SKSE::VersionIndependence::AddressLibrary" -Quiet)) {
            throw "Generated plugin metadata is not Address Library version independent."
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem (Join-Path $vs "VC/Tools/MSVC") -Filter dumpbin.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
          $imports = & $dumpbin /DEPENDENTS "out/build/windows-release-tests/Release/SimpleAlternateLevelling.dll"
          if ($imports -match "(?i)(spdlog|fmt)\.dll") {
            throw "Plugin imports a dynamic spdlog or fmt library."
          }

      - name: Package twice and verify reproducibility
        shell: pwsh
        run: |
          cmake --build --preset windows-package
          $archive = "Deployed/SimpleAlternateLevelling-0.1.0-SkyrimSE-AE.zip"
          $first = (Get-FileHash $archive -Algorithm SHA256).Hash
          cmake --build --preset windows-package
          $second = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($first -ne $second) {
            throw "Deterministic package hash changed between identical builds."
          }
          $checksum = Get-Content "$archive.sha256" -Raw
          $expectedChecksum = "$($second.ToLowerInvariant())  $([IO.Path]::GetFileName($archive))`n"
          if ($checksum -ne $expectedChecksum) {
            throw "Package checksum file does not match the archive."
          }
          $expectedEntries = @(
            "Interface/EA_SkillMenu.swf",
            "Interface/Translations/SimpleAlternateLevelling_ENGLISH.txt",
            "SKSE/Plugins/SimpleAlternateLevelling.dll",
            "SKSE/Plugins/SimpleAlternateLevelling.json"
          )
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive))
          try { $actualEntries = @($zip.Entries.FullName | Sort-Object) } finally { $zip.Dispose() }
          if (Compare-Object $expectedEntries $actualEntries) {
            throw "Package entries do not match the exact mod manifest."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: SimpleAlternateLevelling-0.1.0-SkyrimSE-AE
          path: |
            Deployed/*.zip
            Deployed/*.sha256
          if-no-files-found: error
